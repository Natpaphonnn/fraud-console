# Cost assumptions for threshold selection. See notes/01_cost_assumptions.md.
# ILLUSTRATIVE VALUES — assumed for this portfolio project, NOT sourced from a bank.
status: accepted          # accepted by Nat on 2026-11-09 as illustrative
label: "Illustrative assumed costs (not bank data)"
params:
  review_cost_per_alert: 5.0   # USD per step-up / review (every flagged transaction)
  fp_friction_cost: 10.0       # USD extra per good customer sent to step-up
  fn_loss_fraction: 1.0        # multiplier on amount_usd lost on a missed fraud
  fn_fixed_cost: 15.0          # USD per missed fraud (chargeback handling)
# Sensitivity analysis: each parameter scaled by these factors, others at base.
sensitivity_factors: [0.5, 2.0]

# Supplementary three-tier policy (approve / step-up / decline).
# status must be "accepted" before these are used. See notes/01_cost_assumptions.md.
three_tier:
  status: accepted        # accepted by Nat on 2026-11-09 as illustrative
  params:
    stepup_fraud_pass_rate: 0.2   # share of fraud that still gets through step-up
    decline_fp_cost: 50.0         # USD per good customer hard-declined
    decline_tp_cost: 0.0          # USD per fraud declined (automatic, no review)
