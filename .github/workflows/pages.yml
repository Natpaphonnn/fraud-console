# Publish the static project page (web/site/, committed and checked by `make check`) to GitHub Pages.
# No build step: the folder is uploaded as-is. Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy project page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/site
      - id: deployment
        uses: actions/deploy-pages@v5
